# Quai : préparation de nuit des données (GTFS officiels SNCB, STIB, De Lijn, TEC -> fichiers JSON)
# et publication sur GitHub Pages, avec Quai Web (l'appli dans le navigateur, dossier app/).
# Voir pipeline/README.md et docs/INSTALL.md (« Utiliser Quai sans les lunettes : Quai Web »).
# Variable du dépôt (Settings > Secrets and variables > Actions > Variables) :
#   QUAI_RELAY_BASE  adresse https du relais Vercel, sans / final ; sans elle, seules les données sont publiées.
name: Données de nuit

on:
  schedule:
    # 01:15 UTC = 02:15 à Bruxelles en hiver (03:15 en été)
    - cron: '15 1 * * *'
  workflow_dispatch:
    inputs:
      verification:
        description: "Essai d'une branche : préparer les données et balayer les lignes, sans rien publier"
        type: boolean
        required: false
        default: false
  # Après un changement de l'appli : Quai Web est republié (les données sont refaites aussi, GTFS gardés en repli).
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'shared/**'
      - '.github/workflows/nightly.yml'

# Droits par défaut du flux. Chaque job déclare ses propres droits, qui remplacent ceux-ci,
# limités à ce dont il a besoin (voir plus bas).
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; une exécution en cours n'est jamais interrompue.
concurrency:
  group: pages-nightly
  cancel-in-progress: false

jobs:
  build:
    name: Préparer les données
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pages: read
    steps:
      - name: Vérifier le secret BMC_KEY
        env:
          BMC_KEY: ${{ secrets.BMC_KEY }}
        run: |
          if [ -z "$BMC_KEY" ]; then
            echo "::error title=Secret BMC_KEY manquant::Le secret BMC_KEY n'est pas défini. Crée une clé gratuite sur https://api-management-opendata-production.developer.azure-api.net/ (abonnement au produit « Standard »), puis ajoute-la dans Settings > Secrets and variables > Actions > New repository secret, sous le nom BMC_KEY. Les données publiées la veille restent en ligne."
            exit 1
          fi
          echo "Secret BMC_KEY présent."

      - name: Récupérer le dépôt
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            pipeline/package-lock.json
            app/package-lock.json

      - name: Installer les dépendances du pipeline
        working-directory: pipeline
        run: npm ci

      # Repli : les GTFS des nuits précédentes (au plus 7 jours) servent si le portail ne répond pas cette nuit.
      - name: Reprendre les GTFS gardés des nuits précédentes
        uses: actions/cache/restore@v6
        with:
          path: gtfs-cache
          key: gtfs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gtfs-

      - name: Préparer les données (site/data) et la page d'état (site/index.html)
        id: data
        working-directory: pipeline
        env:
          BMC_KEY: ${{ secrets.BMC_KEY }}
        run: npm run build-data -- --out ../site/data --site ../site --cache-dir ../gtfs-cache

      # Même si un réseau a échoué : on garde les GTFS de cette nuit et ceux qui ont servi de repli.
      - name: Garder les GTFS pour les nuits suivantes
        if: ${{ !cancelled() && steps.data.outcome != 'skipped' }}
        uses: actions/cache/save@v6
        with:
          path: gtfs-cache
          key: gtfs-${{ github.run_id }}-${{ github.run_attempt }}

      # Quai Web, publié dans site/app/ (lien « Ouvrir Quai Web » sur la page d'état). Les données sont publiées
      # même si Quai Web ne peut pas être construit : une page d'explication le remplace alors.
      - name: Adresses de Quai Web
        id: web
        env:
          VAR_RELAY_BASE: ${{ vars.QUAI_RELAY_BASE }}
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          owner="$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')"
          if [ "$(printf '%s' "$repo" | tr '[:upper:]' '[:lower:]')" = "$owner.github.io" ]; then
            path="/"
          else
            path="/$repo/"
          fi
          build=true
          if [ -z "$VAR_RELAY_BASE" ]; then
            echo "::notice title=Quai Web non publié::La variable de dépôt QUAI_RELAY_BASE (adresse https du relais Vercel, sans / final) manque : Quai Web n'est pas construit, les données sont publiées quand même. Ajoute la variable dans Settings > Secrets and variables > Actions > Variables, puis relance ce workflow."
            build=false
          fi
          {
            echo "data=https://$owner.github.io${path}data"
            echo "base=${path}app/"
            echo "url=https://$owner.github.io${path}app/"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"

      - name: Construire Quai Web (site/app)
        id: webapp
        if: ${{ steps.web.outputs.build == 'true' }}
        continue-on-error: true
        working-directory: app
        env:
          QUAI_DATA_BASE: ${{ steps.web.outputs.data }}
          QUAI_RELAY_BASE: ${{ vars.QUAI_RELAY_BASE }}
          QUAI_WEB_BASE: ${{ steps.web.outputs.base }}
          WEB_URL: ${{ steps.web.outputs.url }}
        run: |
          npm ci || { echo "Nouvel essai de npm ci dans 20 s."; sleep 20; npm ci; }
          npm run build:web
          mkdir -p ../site
          rm -rf ../site/app
          cp -R dist-web ../site/app
          echo "Quai Web construit : $WEB_URL"

      - name: Page d'attente de Quai Web
        if: ${{ steps.web.outputs.build != 'true' || steps.webapp.outcome != 'success' }}
        env:
          WEB_BUILD: ${{ steps.web.outputs.build }}
        run: |
          if [ "$WEB_BUILD" = "true" ]; then
            echo "::warning title=Quai Web non construit::La construction de Quai Web a échoué (voir l'étape « Construire Quai Web ») : les données sont publiées, Quai Web est remplacé par une page d'explication jusqu'à la prochaine exécution réussie."
            why="La dernière construction de Quai Web a échoué. Le journal se trouve sur GitHub, onglet Actions, workflow « Données de nuit »."
          else
            why="La variable de dépôt QUAI_RELAY_BASE (adresse du relais temps réel) n’est pas encore définie : voir docs/INSTALL.md, étape 5, puis relancer le workflow « Données de nuit »."
          fi
          rm -rf site/app
          mkdir -p site/app
          cat > site/app/index.html <<HTML
          <!DOCTYPE html>
          <html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Quai Web</title>
          <style>body{font-family:Georgia,"Times New Roman",serif;max-width:40rem;margin:2rem auto;padding:0 1rem;color:#222;line-height:1.5}</style></head><body>
          <h1>Quai Web n’est pas disponible pour l’instant</h1>
          <p>$why</p>
          <p><a href="../">Retour à la page d’état des données</a></p>
          </body></html>
          HTML

      # 1.2.6 (PRD-1.2.6 § 9) : toutes les lignes de bus, tram et métro passent par le calcul des lunettes (sens,
      # terminus, toute la ligne, rangées) ; le bilan est dans le journal. Ne bloque jamais la publication.
      - name: Balayer les lignes de bus, tram et métro
        if: ${{ steps.webapp.outcome == 'success' }}
        continue-on-error: true
        working-directory: app
        env:
          QUAI_SCAN_DATA: ../site/data
        run: npx vitest run test/scan

      - name: Configurer GitHub Pages
        if: ${{ !inputs.verification }}
        uses: actions/configure-pages@v6

      - name: Envoyer le site
        if: ${{ !inputs.verification }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Publier sur GitHub Pages
    needs: build
    if: ${{ !inputs.verification }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # La nuit, GitHub Pages met parfois plus de 10 minutes à traiter le site (environ 100 Mo) :
      # on lui laisse 30 minutes, puis on retente une fois. En cas d'échec, le site de la veille reste en ligne.
      - name: Publier
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000
      - name: Attendre avant un nouvel essai
        if: steps.deployment.outcome == 'failure'
        run: sleep 120
      - name: Publier (nouvel essai)
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 1800000

  # GitHub désactive sans prévenir les tâches planifiées d'un dépôt public après 60 jours sans activité.
  # Si le dernier commit de la branche par défaut a plus de 30 jours, on committe un petit fichier daté.
  # Ne fait jamais échouer le flux : en cas de problème, simple avertissement.
  keepalive:
    name: Garder la tâche planifiée active
    needs: [build, deploy]
    if: ${{ !cancelled() && !inputs.verification }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Commit de maintien si la branche par défaut est inactive depuis 30 jours
        continue-on-error: true
        run: |
          warn() { echo "::warning title=Maintien de la tâche planifiée::$1"; exit 0; }
          branch="$(git ls-remote --symref origin HEAD | awk '/^ref:/ { sub("refs/heads/", "", $2); print $2 }')"
          [ -n "$branch" ] || warn "Branche par défaut introuvable, vérification ignorée."
          git fetch --quiet --depth=1 origin "$branch" || warn "Impossible de lire la branche $branch."
          last="$(git log -1 --format=%ct FETCH_HEAD)"
          age=$(( ($(date +%s) - last) / 86400 ))
          echo "Dernier commit sur $branch : il y a $age jour(s)."
          if [ "$age" -lt 30 ]; then
            echo "Dépôt actif, rien à faire."
            exit 0
          fi
          git checkout --quiet -B "$branch" FETCH_HEAD
          mkdir -p .github
          date -u +%Y-%m-%d > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          if git diff --cached --quiet; then echo "Fichier de maintien déjà à jour, rien à committer."; exit 0; fi
          git commit --quiet -m "Maintien de la tâche de nuit (dépôt inactif depuis $age jours)" || warn "Commit de maintien impossible."
          git push --quiet origin "HEAD:$branch" || warn "Envoi de .github/keepalive.txt refusé (branche protégée ?). Sans commit d'ici 60 jours, GitHub désactivera la tâche de nuit : fais un commit à la main."
          echo "Commit de maintien envoyé sur $branch."
