# Quai : intégration continue. À chaque push et pull request : installation propre (npm ci),
# vérification des types et tests de pipeline/, relay/ et app/ (avec un paquet .ehpk de contrôle),
# puis tests de bout en bout de tests/e2e/ sans le simulateur Even Hub. Lecture seule, aucun secret.
name: Intégration continue

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Données (pipeline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - name: Installation
        run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests
        run: npm test

  relay:
    name: Relais temps réel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Installation
        run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - name: Vérification de déploiement (commande lancée par Vercel)
        run: npm run vercel-build

      - name: Tests
        run: npm test

  app:
    name: Appli Even Hub
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            pipeline/package-lock.json

      # Les tests d'intégration de l'appli lisent aussi la vraie sortie du pipeline (.data/fixture-data).
      - name: Installation du pipeline
        working-directory: pipeline
        run: npm ci

      - name: Données de test produites par le pipeline
        working-directory: pipeline
        env:
          QUAI_SOURCES: sncb=../fixtures/pipeline/gtfs/sncb.zip,stib=../fixtures/pipeline/gtfs/stib.zip,delijn=../fixtures/pipeline/gtfs/delijn.zip,tec=../fixtures/pipeline/gtfs/tec.zip
          QUAI_DATE: '2026-11-10'
        run: npm run build-data -- --out ../.data/fixture-data

      - name: Installation
        run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Paquet de contrôle (adresses d'exemple, rien n'est publié)
        env:
          QUAI_DATA_BASE: https://example.github.io/quai/data
          QUAI_RELAY_BASE: https://example.vercel.app
        run: |
          npm run configure
          npm run pack
          ls -l quai.ehpk

  e2e:
    name: Bout en bout (sans simulateur)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Les tests qui demandent le simulateur Even Hub (absent des machines GitHub) sont ignorés.
      QUAI_SKIP_SIM: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Présence des tests de bout en bout
        id: e2e
        run: |
          if [ -f tests/e2e/package.json ] && node -e "process.exit(require('./tests/e2e/package.json').scripts?.test ? 0 : 1)"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Pas de tests/e2e/package.json avec un script test : rien à lancer."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.e2e.outputs.present == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            pipeline/package-lock.json
            relay/package-lock.json
            app/package-lock.json
            tests/e2e/package-lock.json

      # Les tests de bout en bout lancent les vraies commandes des paquets (pipeline, relais, cœur de l'appli).
      - name: Installation des paquets
        if: steps.e2e.outputs.present == 'true'
        run: |
          for dir in pipeline relay app tests/e2e; do
            echo "::group::npm ci ($dir)"
            (cd "$dir" && npm ci)
            echo "::endgroup::"
          done

      - name: Vérification des types
        if: steps.e2e.outputs.present == 'true'
        working-directory: tests/e2e
        run: npm run typecheck --if-present

      - name: Tests de bout en bout
        if: steps.e2e.outputs.present == 'true'
        working-directory: tests/e2e
        run: npm test
